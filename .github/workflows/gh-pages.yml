name: GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned: "latest" could pull in a Hugo release the Blowfish theme doesn't support
          # and break the site. 0.164.0 is the version the live site was last built with.
          # Upgrade deliberately (change this number, push, check the Actions tab).
          hugo-version: "0.164.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Disable Jekyll
        run: echo > public/.nojekyll

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
